<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>連続性マップ｜景観生態学II</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
  :root {
    --ink: #24332b;
    --muted: #5f6f66;
    --line: #d5ddd8;
    --paper: #ffffff;
    --ui: #2f6b4f;
    --ui-dark: #23523c;
    --warn: #b3261e;
    --caution: #8a5a00;
    --ramp-low: #ffffff;
    --ramp-high: #e0201b;
    --font: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Meiryo", sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; font-family: var(--font); color: var(--ink); background: #e8ece9; }
  #map { position: absolute; inset: 0; }

  .panel {
    position: absolute; z-index: 1000; top: 12px; left: 12px;
    width: 300px; max-height: calc(100% - 24px); overflow-y: auto;
    background: var(--paper); border: 1px solid var(--line); border-radius: 6px;
    padding: 16px 18px 18px; line-height: 1.6;
    box-shadow: 0 2px 10px rgba(36, 51, 43, .18);
  }
  .panel-head { display: flex; align-items: flex-start; gap: 8px; }
  .panel-head > div { flex: 1; min-width: 0; }
  .panel h1 { font-size: 1.15rem; margin: 0 0 2px; letter-spacing: .02em; }
  .panel .sub { font-size: .8rem; color: var(--muted); margin: 0; }
  .toggle {
    display: none; flex: none; border: 1px solid var(--line); background: #fff; color: var(--ink);
    border-radius: 4px; padding: 2px 10px; font-size: .78rem; cursor: pointer;
  }
  .panel.collapsed .body, .panel.collapsed .sub { display: none; }
  .body { margin-top: 2px; }
  .step { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
  .step h2 { font-size: .9rem; margin: 0 0 8px; display: flex; gap: 8px; align-items: baseline; }
  .step h2 .n {
    display: inline-grid; place-items: center; width: 1.4em; height: 1.4em; flex: none;
    border-radius: 50%; background: var(--ui); color: #fff; font-size: .78rem;
  }
  .step.off { opacity: .45; pointer-events: none; }

  button, select, input { font: inherit; }
  .btn {
    display: block; width: 100%; padding: 9px 12px; border: 0; border-radius: 4px;
    background: var(--ui); color: #fff; font-weight: 700; cursor: pointer;
  }
  .btn:hover { background: var(--ui-dark); }
  .btn.sub-btn { background: #fff; color: var(--ui-dark); border: 1px solid var(--ui); }
  .btn.sub-btn:hover { background: #eef4f0; }
  .hint { font-size: .78rem; color: var(--muted); margin: 6px 0 0; }
  .file-name { font-size: .8rem; margin: 8px 0 0; word-break: break-all; }
  .msg { font-size: .8rem; margin: 8px 0 0; color: var(--warn); }
  .msg:empty { display: none; }

  select {
    width: 100%; padding: 7px 8px; border: 1px solid var(--line); border-radius: 4px;
    background: #fff; color: var(--ink);
  }
  :focus-visible { outline: 3px solid #f2b705; outline-offset: 2px; }

  .legend { margin-top: 12px; }
  .legend .bar {
    height: 14px; border: 1px solid #9aa79f; border-radius: 2px;
    background: linear-gradient(to right, var(--ramp-low), var(--ramp-high));
  }
  .legend .ends { display: flex; justify-content: space-between; font-size: .78rem; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .legend .ends span:last-child { text-align: right; }
  .legend .cap { font-size: .78rem; color: var(--muted); margin-top: 2px; }
  .legend .nodata { font-size: .78rem; margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .legend .nodata i { width: 14px; height: 10px; background: #c9c9c9; border: 1px solid #9aa79f; display: inline-block; }

  .row { display: flex; align-items: center; gap: 10px; margin-top: 12px; font-size: .82rem; }
  .row input { flex: 1; accent-color: var(--ui); }

  .share-out { margin-top: 10px; }
  .share-out .line { display: flex; gap: 6px; }
  .share-out input {
    flex: 1; min-width: 0; padding: 6px 8px; border: 1px solid var(--line); border-radius: 4px;
    font-size: .78rem; color: var(--ink); background: #f6f8f7;
  }
  .share-out button {
    flex: none; padding: 6px 12px; border: 0; border-radius: 4px; background: var(--ui); color: #fff;
    font-size: .8rem; font-weight: 700; cursor: pointer;
  }
  .share-note { font-size: .78rem; margin: 6px 0 0; color: var(--muted); }
  .share-note.caution { color: var(--caution); }
  .share-note.error { color: var(--warn); }

  .drop {
    position: absolute; inset: 0; z-index: 2000; display: none;
    place-items: center; background: rgba(47, 107, 79, .18);
    border: 4px dashed var(--ui); font-size: 1.3rem; font-weight: 700; color: var(--ui-dark);
  }
  .drop.on { display: grid; }

  .leaflet-popup-content { font-family: var(--font); font-size: .8rem; margin: 10px 12px; }
  .props { border-collapse: collapse; }
  .props th, .props td { padding: 2px 6px; border-bottom: 1px solid #eceff0; text-align: left; vertical-align: top; }
  .props th { color: var(--muted); font-weight: 400; white-space: nowrap; }
  .props td { font-variant-numeric: tabular-nums; word-break: break-all; }
  .props tr.sel th, .props tr.sel td { color: var(--ink); font-weight: 700; background: #fde8e7; }

  @media (max-width: 640px) {
    .panel { top: auto; bottom: 26px; left: 8px; right: 8px; width: auto; max-height: 46%; padding: 12px 14px 14px; }
    .toggle { display: block; }
  }
</style>
</head>
<body>
<div id="map" role="application" aria-label="地図"></div>

<section class="panel" id="panel" aria-label="操作パネル">
  <div class="panel-head">
    <div>
      <h1>連続性マップ</h1>
      <p class="sub">景観生態学II　GeoJSON の属性を白→赤で塗り分けて表示します</p>
    </div>
    <button class="toggle" id="toggle" type="button" aria-expanded="true" aria-controls="panel-body">閉じる</button>
  </div>

  <div class="body" id="panel-body">
    <div class="step">
      <h2><span class="n">1</span>ファイルを読み込む</h2>
      <button class="btn" id="pick" type="button">GeoJSON を選ぶ</button>
      <input id="file" type="file" accept=".geojson,.json,application/geo+json,application/json" hidden>
      <p class="hint">地図の上にファイルをドラッグ＆ドロップしても読み込めます。</p>
      <p class="file-name" id="fname"></p>
      <p class="msg" id="msg" role="alert"></p>
    </div>

    <div class="step off" id="step2">
      <h2><span class="n">2</span>色を塗る列を選ぶ</h2>
      <select id="col" aria-label="色を塗る列"></select>
      <div class="legend" id="legend" hidden>
        <div class="bar" id="bar"></div>
        <div class="ends"><span id="vmin"></span><span id="vmax"></span></div>
        <div class="cap" id="cap">赤いほど値が大きい</div>
        <div class="nodata" id="nodata" hidden><i></i>値なし</div>
      </div>
      <label class="row">透明度<input id="opacity" type="range" min="0.2" max="1" step="0.05" value="0.85"></label>
    </div>

    <div class="step off" id="step3">
      <h2><span class="n">3</span>共有する</h2>
      <button class="btn sub-btn" id="share" type="button">この表示の共有URLを作る</button>
      <div class="share-out" id="share-out" hidden>
        <div class="line">
          <input id="share-url" type="text" readonly aria-label="共有URL">
          <button id="copy" type="button">コピー</button>
        </div>
      </div>
      <p class="share-note" id="share-note" hidden></p>
    </div>
  </div>
</section>

<div class="drop" id="drop">ここにドロップして読み込む</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  const RAMP_LOW = [255, 255, 255];
  const RAMP_HIGH = [224, 32, 27];
  const NODATA = '#c9c9c9';
  const PREFERRED = ['connect_rev', 'connect'];
  const MOBILE = window.matchMedia('(max-width: 640px)');
  // 共有URLの長さの目安（文字数）
  const URL_WARN = 8000;      // これを超えるとメール・LMS・チャットで切れることがある
  const URL_MAX = 2000000;    // Chrome の上限（約2MB）

  const $ = (id) => document.getElementById(id);
  const map = L.map('map', { zoomControl: false }).setView([35.45, 134.2], 11);

  const gsi = (id, ext, maxNativeZoom) => L.tileLayer(
    `https://cyberjapandata.gsi.go.jp/xyz/${id}/{z}/{x}/{y}.${ext}`,
    { maxNativeZoom, maxZoom: 19, attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>' }
  );
  const BASES = [
    { key: 'pale', label: '淡色地図', layer: gsi('pale', 'png', 18) },
    { key: 'std', label: '標準地図', layer: gsi('std', 'png', 18) },
    { key: 'photo', label: '写真', layer: gsi('seamlessphoto', 'jpg', 18) },
  ];
  let baseKey = 'pale';
  BASES[0].layer.addTo(map);
  L.control.zoom({ position: 'topright' }).addTo(map);
  L.control.layers(Object.fromEntries(BASES.map((b) => [b.label, b.layer])), null, { position: 'topright' }).addTo(map);
  L.control.scale({ imperial: false, position: MOBILE.matches ? 'topleft' : 'bottomright' }).addTo(map);
  map.on('baselayerchange', (e) => {
    const b = BASES.find((x) => x.layer === e.layer);
    if (b) baseKey = b.key;
  });
  function setBase(key) {
    const b = BASES.find((x) => x.key === key);
    if (!b || b.key === baseKey) return;
    BASES.forEach((x) => map.removeLayer(x.layer));
    b.layer.addTo(map);
    baseKey = b.key;
  }

  let layer = null;
  let data = null;
  let column = '';
  let range = null;
  let opacity = Number($('opacity').value);
  // 読み込み元。共有URLの作り方が変わる：{ kind: 'url', url } または { kind: 'file', name }
  let source = null;

  // ---------- パネルの開閉（スマホ） ----------
  function setCollapsed(collapsed) {
    $('panel').classList.toggle('collapsed', collapsed);
    $('toggle').textContent = collapsed ? '開く' : '閉じる';
    $('toggle').setAttribute('aria-expanded', String(!collapsed));
  }
  $('toggle').addEventListener('click', () => setCollapsed(!$('panel').classList.contains('collapsed')));

  // パネルに隠れないように、地図を寄せるときの余白をパネルの位置から決める
  function fitPadding() {
    const p = $('panel').getBoundingClientRect();
    if (MOBILE.matches) {
      return { paddingTopLeft: [20, 20], paddingBottomRight: [60, window.innerHeight - p.top + 12] };
    }
    return { paddingTopLeft: [p.right + 20, 30], paddingBottomRight: [60, 30] };
  }

  // ---------- 読み込み ----------
  $('pick').addEventListener('click', () => $('file').click());
  $('file').addEventListener('change', (e) => {
    if (e.target.files[0]) readFile(e.target.files[0]);
    e.target.value = '';
  });

  let dragDepth = 0;
  window.addEventListener('dragenter', (e) => { if (hasFiles(e)) { dragDepth++; $('drop').classList.add('on'); } });
  window.addEventListener('dragleave', () => { dragDepth = Math.max(0, dragDepth - 1); if (!dragDepth) $('drop').classList.remove('on'); });
  window.addEventListener('dragover', (e) => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', (e) => {
    if (!hasFiles(e)) return;
    e.preventDefault();
    dragDepth = 0;
    $('drop').classList.remove('on');
    const f = e.dataTransfer.files[0];
    if (f) readFile(f);
  });
  function hasFiles(e) { return e.dataTransfer && Array.from(e.dataTransfer.types || []).includes('Files'); }

  function readFile(file) {
    const r = new FileReader();
    r.onload = () => load(r.result, file.name, { kind: 'file', name: file.name });
    r.onerror = () => fail('ファイルを読み込めませんでした。もう一度選び直してください。');
    r.readAsText(file);
  }

  async function loadUrl(url, state) {
    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error(res.status);
      load(await res.text(), decodeURIComponent(url.split('/').pop().split('?')[0]), { kind: 'url', url }, state);
    } catch (err) {
      fail(`URL から読み込めませんでした（${url}）。`);
    }
  }

  function load(text, name, src, state) {
    $('msg').textContent = '';
    let gj;
    try { gj = JSON.parse(text); }
    catch { return fail('GeoJSON として読めません。拡張子が .geojson のファイルを選んでください。'); }

    if (gj.type === 'Feature') gj = { type: 'FeatureCollection', features: [gj] };
    if (gj.type !== 'FeatureCollection' || !Array.isArray(gj.features) || !gj.features.length) {
      return fail('地物が含まれていません。Colab で保存したファイルか確認してください。');
    }
    const pt = firstCoord(gj);
    if (!pt || Math.abs(pt[0]) > 180 || Math.abs(pt[1]) > 90) {
      return fail('座標が緯度経度になっていません。QGIS から書き出す場合は座標参照系を EPSG:4326 にしてください。');
    }

    data = gj;
    source = src;
    $('fname').textContent = `読み込み済み：${name}（${gj.features.length} 地物）`;
    buildColumnList(state && state.col);
    if (state) {
      if (state.op) { opacity = clamp(Number(state.op), 0.2, 1) || opacity; $('opacity').value = opacity; }
      if (state.base) setBase(state.base);
      // スマホで共有URLから開いたときは、地図が見えるようにパネルを畳む
      if (MOBILE.matches) setCollapsed(true);
    }
    $('step2').classList.remove('off');
    $('step3').classList.remove('off');
    resetShare();
    draw();
    const b = layer.getBounds();
    if (b.isValid()) map.fitBounds(b, fitPadding());
  }

  function fail(text) { $('msg').textContent = text; }
  function clamp(v, lo, hi) { return Number.isFinite(v) ? Math.min(hi, Math.max(lo, v)) : NaN; }

  function firstCoord(gj) {
    for (const f of gj.features) {
      let c = f && f.geometry && f.geometry.coordinates;
      while (Array.isArray(c) && Array.isArray(c[0])) c = c[0];
      if (Array.isArray(c) && typeof c[0] === 'number') return c;
    }
    return null;
  }

  // ---------- 列の選択 ----------
  function numericColumns(gj) {
    const seen = new Map();
    for (const f of gj.features) {
      for (const [k, v] of Object.entries(f.properties || {})) {
        if (v === null || v === undefined || v === '') continue;
        const ok = typeof v === 'number' && Number.isFinite(v);
        seen.set(k, (seen.get(k) ?? true) && ok);
      }
    }
    return [...seen].filter(([, ok]) => ok).map(([k]) => k);
  }

  function buildColumnList(wanted) {
    const cols = numericColumns(data);
    const sel = $('col');
    sel.innerHTML = '';
    sel.append(new Option('塗らない（輪郭のみ）', ''));
    cols.forEach((c) => sel.append(new Option(c, c)));
    if (wanted === '' || (wanted && cols.includes(wanted))) column = wanted;
    else column = PREFERRED.find((c) => cols.includes(c)) || '';
    sel.value = column;
  }

  $('col').addEventListener('change', (e) => { column = e.target.value; draw(); resetShare(); });
  $('opacity').addEventListener('input', (e) => {
    opacity = Number(e.target.value);
    if (layer) layer.setStyle(style);
    resetShare();
  });
  map.on('baselayerchange', resetShare);

  // ---------- 描画 ----------
  function computeRange() {
    if (!column) return null;
    let min = Infinity, max = -Infinity;
    for (const f of data.features) {
      const v = (f.properties || {})[column];
      if (typeof v !== 'number' || !Number.isFinite(v)) continue;
      if (v < min) min = v;
      if (v > max) max = v;
    }
    return min <= max ? { min, max } : null;
  }

  function rampColor(t) {
    const c = RAMP_LOW.map((lo, i) => Math.round(lo + (RAMP_HIGH[i] - lo) * t));
    return `rgb(${c.join(',')})`;
  }

  function colorOf(v) {
    if (typeof v !== 'number' || !Number.isFinite(v)) return NODATA;
    // 全地物が同じ値なら差がないので中間色で塗る（全面が「最大＝真っ赤」に見えるのを避ける）
    const t = range.max === range.min ? 0.5 : (v - range.min) / (range.max - range.min);
    return rampColor(t);
  }

  function style(f) {
    const filled = column && range;
    return {
      color: '#3d4a43', weight: 0.8,
      fillColor: filled ? colorOf((f.properties || {})[column]) : '#ffffff',
      fillOpacity: filled ? opacity : 0.15,
    };
  }

  function draw() {
    range = computeRange();
    if (layer) map.removeLayer(layer);
    layer = L.geoJSON(data, {
      style,
      onEachFeature: (f, lyr) => lyr.bindPopup(() => popupHtml(f.properties || {}), { maxWidth: 320 }),
    }).addTo(map);
    updateLegend();
  }

  function updateLegend() {
    const lg = $('legend');
    if (!column || !range) { lg.hidden = true; return; }
    lg.hidden = false;
    if (range.min === range.max) {
      $('bar').style.background = rampColor(0.5);
      $('vmin').textContent = fmt(range.min);
      $('vmax').textContent = '';
      $('cap').textContent = '全地物が同じ値のため、色の差はありません';
    } else {
      $('bar').style.background = '';
      // 最大値に比べて無視できるほど小さい最小値は「≈0」と表示
      const tiny = range.min !== 0 && Math.abs(range.min) < (range.max - range.min) * 1e-6;
      $('vmin').textContent = tiny ? '≈0' : fmt(range.min);
      $('vmin').title = String(range.min);
      $('vmax').textContent = fmt(range.max);
      $('vmax').title = String(range.max);
      $('cap').textContent = '赤いほど値が大きい';
    }
    const missing = data.features.some((f) => typeof (f.properties || {})[column] !== 'number');
    $('nodata').hidden = !missing;
  }

  function fmt(v) {
    if (v === 0) return '0';
    const a = Math.abs(v);
    if (a < 0.001 || a >= 1e6) return v.toExponential(2);
    return Number(v.toPrecision(4)).toString();
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }

  function popupHtml(p) {
    const rows = Object.entries(p).map(([k, v]) => {
      const shown = typeof v === 'number' && Number.isFinite(v) ? fmt(v) : v;
      return `<tr class="${k === column ? 'sel' : ''}"><th>${esc(k)}</th><td title="${esc(v)}">${esc(shown)}</td></tr>`;
    }).join('');
    return `<table class="props">${rows}</table>`;
  }

  // ---------- 共有URL ----------
  // URL から読み込んだ場合：?data=<URL>#col=..&op=..&base=..
  // 手元のファイルの場合　：#gz=<圧縮したGeoJSON>&name=..&col=..&op=..&base=..
  //   ＃以降はサーバーに送られないので、データはURLの中だけに入る（URLを知っている人は誰でも見られる）
  function resetShare() {
    $('share-out').hidden = true;
    $('share-note').hidden = true;
  }

  function note(text, kind) {
    const n = $('share-note');
    n.textContent = text;
    n.className = 'share-note' + (kind ? ' ' + kind : '');
    n.hidden = false;
  }

  function stateParams() {
    const h = new URLSearchParams();
    h.set('col', column);
    h.set('op', String(opacity));
    h.set('base', baseKey);
    return h;
  }

  // 座標を小数6桁（約0.1m）に丸めてURLを短くする
  function roundCoords(c) {
    return Array.isArray(c) ? c.map(roundCoords) : (typeof c === 'number' ? Math.round(c * 1e6) / 1e6 : c);
  }
  function compactGeoJSON(gj) {
    return {
      type: 'FeatureCollection',
      features: gj.features.map((f) => ({
        type: 'Feature',
        properties: f.properties || {},
        geometry: f.geometry ? { ...f.geometry, coordinates: roundCoords(f.geometry.coordinates) } : null,
      })),
    };
  }

  async function pipeBytes(bytes, stream) {
    const out = new Response(new Blob([bytes]).stream().pipeThrough(stream));
    return new Uint8Array(await out.arrayBuffer());
  }
  function toB64url(bytes) {
    let s = '';
    for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  }
  function fromB64url(str) {
    const b = atob(str.replace(/-/g, '+').replace(/_/g, '/'));
    const u = new Uint8Array(b.length);
    for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
    return u;
  }
  async function encodeData(gj) {
    const json = new TextEncoder().encode(JSON.stringify(compactGeoJSON(gj)));
    return toB64url(await pipeBytes(json, new CompressionStream('deflate-raw')));
  }
  async function decodeData(str) {
    return new TextDecoder().decode(await pipeBytes(fromB64url(str), new DecompressionStream('deflate-raw')));
  }

  $('share').addEventListener('click', async () => {
    if (!data || !source) return;
    const base = location.origin + location.pathname;
    const h = stateParams();
    let url;
    if (source.kind === 'url') {
      url = `${base}?data=${encodeURIComponent(source.url)}#${h}`;
    } else {
      if (typeof CompressionStream === 'undefined') {
        return note('このブラウザは共有URLの作成に対応していません。Chrome・Edge・Firefox・Safari の最新版を使ってください。', 'error');
      }
      note('作成中…');
      let gz;
      try { gz = await encodeData(data); }
      catch { return note('共有URLを作れませんでした。', 'error'); }
      h.set('name', source.name);
      url = `${base}#gz=${gz}&${h}`;
    }

    if (url.length > URL_MAX) {
      resetShare();
      return note(`データが大きすぎてURLに入りません（${kb(url.length)}）。GeoJSON を GitHub などに置き、?data=<そのURL> の形で共有してください。`, 'error');
    }
    $('share-url').value = url;
    $('share-out').hidden = false;
    if (source.kind === 'url') {
      note('読み込み元のURLと表示設定（列・透明度・背景地図）が入ったURLです。');
    } else if (url.length > URL_WARN) {
      note(`データ本体をURLに入れました（${kb(url.length)}）。長いので、メール・LMS・チャットでは途中で切れることがあります。切れる場合は GeoJSON を GitHub などに置いて ?data= で共有してください。URLを知っている人は誰でもデータを見られます。`, 'caution');
    } else {
      note(`データ本体をURLに入れました（${kb(url.length)}）。URLを知っている人は誰でもデータを見られます。`);
    }
  });

  $('copy').addEventListener('click', async () => {
    const inp = $('share-url');
    try {
      await navigator.clipboard.writeText(inp.value);
    } catch {
      inp.select();
      document.execCommand('copy');
    }
    $('copy').textContent = 'コピー済み';
    setTimeout(() => { $('copy').textContent = 'コピー'; }, 1500);
  });

  function kb(n) { return n < 1024 ? `${n} 文字` : `約 ${Math.round(n / 1024)} KB`; }

  // ---------- 起動時：URL から読み込む ----------
  (async () => {
    const hash = new URLSearchParams(location.hash.slice(1));
    const state = { col: hash.get('col'), op: hash.get('op'), base: hash.get('base') };
    const gz = hash.get('gz');
    const q = new URLSearchParams(location.search).get('data');
    if (gz) {
      if (typeof DecompressionStream === 'undefined') {
        return fail('このブラウザは共有URLの読み込みに対応していません。Chrome・Edge・Firefox・Safari の最新版で開いてください。');
      }
      let text;
      try { text = await decodeData(gz); }
      catch { return fail('共有URLのデータを読めません。URLが途中で切れている可能性があります。'); }
      const name = hash.get('name') || '共有データ';
      load(text, `${name}（共有URLから）`, { kind: 'file', name }, state);
    } else if (q) {
      loadUrl(q, state);
    }
  })();
})();
</script>
</body>
</html>
